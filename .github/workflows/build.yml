name: Build installers (Windows + macOS)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer (.exe) and portable .exe
        run: npx electron-builder --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: MKhalafWarehouse-Windows
          path: dist/*.exe
          if-no-files-found: error
      - name: Read app version
        id: ver
        shell: bash
        run: echo "v=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish to the GitHub release for this version
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          name: M. Khalaf Warehouse ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: dist/*.exe

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build universal .dmg and .zip (Apple Silicon + Intel, ad-hoc signed)
        run: npx electron-builder --mac --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: MKhalafWarehouse-macOS
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
      - name: Read app version
        id: ver
        shell: bash
        run: echo "v=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish to the GitHub release for this version
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          name: M. Khalaf Warehouse ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: |
            dist/*.dmg
            dist/*.zip
